name: MiniVid
options:
  bundleIdPrefix: com.jt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion
    from: "1.1.1"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.16"
targets:
  MiniVid:
    type: application
    platform: iOS
    sources:
      - MiniVid
    dependencies:
      - package: StableDiffusion
      - package: ZIPFoundation
    scheme:
      testTargets: []
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jt.minivid
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: MiniVid/MiniVid.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: MiniVid
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "MiniVid uses the microphone to record a voiceover over your generated videos."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
