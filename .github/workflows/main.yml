name: Build MiniVid for iPhone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Download MiniVid source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List available schemes
        run: xcodebuild -list -project MiniVid.xcodeproj

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MiniVid.xcodeproj \
            -scheme MiniVid

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project MiniVid.xcodeproj \
            -scheme MiniVid \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MiniVid.app Payload/
          zip -r MiniVid-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MiniVid-IPA
          path: MiniVid-unsigned.ipa
